<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>هلا دليفري</title>
<style>
body{margin:0;font-family:Arial;background:#fff;color:#222}
header{background:#ffdf00;padding:25px;text-align:center}
main{padding:20px;max-width:500px;margin:auto}
.card{background:#fff8cc;padding:18px;border-radius:14px}
input,textarea,select,button{width:100%;box-sizing:border-box;padding:14px;margin:8px 0;border-radius:9px;border:1px solid #ccc;font-size:16px}
button{background:#ffdf00;border:0;font-weight:bold}
</style>
</head>
<body>
<header>
<h1>هلا دليفري</h1>
<p>طلباتك توصلك لحد باب بيتك</p>
<strong>الطبقة - سوريا</strong>
</header>
<main>
<div class="card">
<h2>اطلب الآن</h2>
<form id="orderForm">
<input id="customer_name" placeholder="الاسم الكامل" required>
<input id="phone" type="tel" placeholder="رقم الهاتف" required>
<input id="address" placeholder="العنوان بالتفصيل" required>
<select id="category" required>
<option value="">اختر نوع الطلب</option>
<option>مطاعم</option>
<option>بقالة</option>
<option>صيدلية</option>
<option>متاجر</option>
<option>خضار وفواكه</option>
<option>طلبات أخرى</option>
</select>
<textarea id="details" placeholder="تفاصيل الطلب" required></textarea>
<p>الدفع نقداً عند الاستلام</p>
<button id="sendButton" type="submit">إرسال الطلب</button>
</form>
<p id="message"></p>
</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const db = supabase.createClient(
'https://ppcqpzdofdhxgyoirvpm.supabase.co',
'sb_publishable_tctaUvY3SVSJ6yRs5MDnBQ_m9lkmi2g'
);

document.getElementById('orderForm').onsubmit = async function(e){
e.preventDefault();

const button = document.getElementById('sendButton');
const message = document.getElementById('message');
button.disabled = true;
button.textContent = 'جارٍ إرسال الطلب...';

const {error} = await db.from('orders').insert([{
customer_name: document.getElementById('customer_name').value,
phone: document.getElementById('phone').value,
address: document.getElementById('address').value,
category: document.getElementById('category').value,
details: document.getElementById('details').value,
city: 'الطبقة',
payment_method: 'cash'
}]);

if(error){
message.textContent = 'تعذر إرسال الطلب. حاول مرة أخرى.';
}else{
message.textContent = 'تم إرسال طلبك بنجاح ❤️';
this.reset();
}

button.disabled = false;
button.textContent = 'إرسال الطلب';
};
</script>
</body>
</html>
